<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O'quv Markaz</title>
<meta name="theme-color" content="#070b22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>

<div class="topbar">
  <a href="#/" class="brand glass"><i class="logo"></i><b id="brandName">O'quv Markaz</b></a>
  <nav class="dock glass" id="dock"></nav>
  <div class="right glass" id="right"></div>
</div>

<main id="view"></main>

<button class="fab" data-act="aiToggle" aria-label="AI yordamchi"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg></button>
<section class="aip glass hide" id="aip">
  <div class="aih"><span>AI yordamchi</span><button class="btn sm" data-act="aiToggle">Yopish</button></div>
  <div class="aim" id="aim"></div>
  <div class="aif"><input class="in" id="aiIn" placeholder="Savol yozing..." autocomplete="off"><button class="btn primary" data-act="aiSend">Yuborish</button></div>
</section>
<div class="toasts" id="toasts"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
